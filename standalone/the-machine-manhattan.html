<!doctype html>
<html lang="zh-CN">
<head>
  <!-- ================================================================
       PART 1 / 页面基础设置
       这个文件不引用任何外部字体、图片、脚本或样式表，因此可以离线打开。
       ================================================================ -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>The Machine: Manhattan — Offline</title>

  <style>
    /* ================================================================
       PART 2 / CSS 视觉样式
       修改颜色：先看 :root；修改布局：搜索 .workspace；修改地图：搜索 .map。
       ================================================================ */
    :root {
      --bg: #050806;
      --panel: #0a0f0b;
      --panel-2: #101611;
      --line: #2c382d;
      --line-strong: #526253;
      --text: #cbd4c4;
      --muted: #778374;
      --green: #91a88a;
      --green-bright: #c4d5bb;
      --red: #d95049;
      --amber: #d1ad68;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 60% 20%, rgba(124, 151, 115, .08), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Consolas, "SFMono-Regular", "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      letter-spacing: .025em;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 99;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.018) 0,
        rgba(255,255,255,.018) 1px,
        transparent 1px,
        transparent 4px
      );
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, [role="button"]:focus-visible, input:focus-visible {
      outline: 1px solid var(--green-bright);
      outline-offset: 2px;
    }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #070a08; }
    ::-webkit-scrollbar-thumb { background: #354236; }

    .app {
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(130,150,122,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(130,150,122,.018) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ----- 顶部标题栏 ----- */
    .topbar {
      min-height: 76px;
      padding: 0 22px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(6,9,7,.96);
    }
    .brand { display: flex; align-items: center; gap: 15px; }
    .brand h1 { margin: 0; color: var(--green-bright); font-size: 20px; font-weight: 500; letter-spacing: .19em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 8px; letter-spacing: .15em; }
    .mark { width: 36px; height: 36px; border: 1px solid var(--green); transform: rotate(45deg); position: relative; }
    .mark::before, .mark::after { content: ""; position: absolute; background: var(--green); opacity: .65; }
    .mark::before { left: 4px; right: 4px; top: 50%; height: 1px; }
    .mark::after { top: 4px; bottom: 4px; left: 50%; width: 1px; }
    .mark i { position: absolute; width: 4px; height: 4px; background: var(--green-bright); }
    .mark i:nth-child(1) { top: 5px; left: 5px; }
    .mark i:nth-child(2) { top: 5px; right: 5px; }
    .mark i:nth-child(3) { right: 5px; bottom: 5px; }
    .online { padding: 0 28px; align-self: stretch; display: flex; align-items: center; gap: 9px; border-inline: 1px solid var(--line); color: var(--green); font-size: 9px; letter-spacing: .12em; }
    .online i { width: 6px; height: 6px; border-radius: 50%; background: var(--green-bright); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .clock { justify-self: end; text-align: right; }
    .clock span, .clock em { display: block; color: var(--muted); font-size: 7px; font-style: normal; }
    .clock strong { display: block; color: var(--green-bright); font-size: 21px; font-weight: 400; letter-spacing: .08em; }

    /* ----- 模式与页面切换栏 ----- */
    .modebar {
      min-height: 43px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 285px 1fr 210px;
      border-bottom: 1px solid var(--line);
      background: #080b09;
    }
    .mode-buttons, .surface-buttons { display: flex; }
    .mode-buttons { border-right: 1px solid var(--line); }
    .surface-buttons { justify-content: center; }
    .modebar button {
      position: relative;
      padding: 0 23px;
      border: 0;
      background: transparent;
      color: #596558;
      cursor: pointer;
      font-size: 8px;
      letter-spacing: .09em;
    }
    .mode-buttons button { flex: 1; padding: 0 8px; }
    .modebar button:hover, .modebar button.active { color: var(--green-bright); background: rgba(130,153,123,.055); }
    .modebar button.active::after { content: ""; position: absolute; height: 2px; left: 12px; right: 12px; bottom: 0; background: var(--green); }
    .offline-badge { align-self: center; justify-self: end; padding: 5px 8px; border: 1px solid #745f36; color: var(--amber); font-size: 7px; letter-spacing: .1em; }

    /* ----- 三栏主布局 ----- */
    .workspace {
      min-height: calc(100vh - 143px);
      display: grid;
      grid-template-columns: minmax(235px,.72fr) minmax(610px,1.9fr) minmax(285px,.86fr);
    }
    .queue, .main-panel, .dossier { min-width: 0; background: rgba(7,11,8,.92); }
    .queue { max-height: calc(100vh - 143px); overflow: auto; border-right: 1px solid var(--line-strong); }
    .dossier { max-height: calc(100vh - 143px); overflow: auto; border-left: 1px solid var(--line-strong); }
    .main-panel { display: flex; flex-direction: column; background: radial-gradient(circle at 50% 45%, rgba(77,102,73,.11), transparent 35rem), #060907; }

    /* ----- 左侧队列 ----- */
    .queue-head { height: 72px; padding: 13px 15px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .queue-head div { display: flex; align-items: center; gap: 14px; }
    .queue-head span { color: var(--muted); font-size: 8px; }
    .queue-head strong { color: var(--red); font-size: 33px; font-weight: 300; }
    .queue-head em { align-self: end; color: #485248; font-size: 6px; font-style: normal; }
    .threshold { padding: 12px 15px; border-bottom: 1px solid var(--line); }
    .threshold label, .threshold small { display: flex; justify-content: space-between; color: var(--muted); font-size: 7px; }
    .threshold label b { color: var(--green-bright); font-weight: 400; }
    .threshold input { width: 100%; height: 20px; appearance: none; background: transparent; cursor: pointer; }
    .threshold input::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, #7d2927, var(--line-strong)); }
    .threshold input::-webkit-slider-thumb { appearance: none; width: 8px; height: 14px; margin-top: -6px; border: 1px solid var(--green-bright); background: var(--bg); }
    .threshold small { color: #465047; font-size: 6px; }
    .subject-button {
      width: 100%; min-height: 56px; padding: 0 12px;
      display: grid; grid-template-columns: 26px 1fr auto; align-items: center;
      border: 0; border-bottom: 1px solid #202820; background: transparent; text-align: left; cursor: pointer;
    }
    .subject-button:hover, .subject-button.active { background: linear-gradient(90deg, rgba(119,143,112,.13), transparent); }
    .subject-button.active { box-shadow: inset 2px 0 var(--red); }
    .subject-button.quiet { opacity: .48; }
    .subject-button .number { color: #4d574c; font-size: 7px; }
    .subject-button .identity, .subject-button .score { display: flex; flex-direction: column; gap: 4px; }
    .subject-button .identity b { color: var(--text); font-size: 9px; font-weight: 400; }
    .subject-button em { color: #596458; font-size: 6px; font-style: normal; }
    .subject-button .score { align-items: end; }
    .subject-button .score b { color: var(--red); font-size: 14px; font-weight: 400; }
    .section { padding: 14px; border-bottom: 1px solid var(--line); }
    .section-title { margin-bottom: 9px; padding-bottom: 7px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 7px; letter-spacing: .09em; }
    .section-title em { color: #526052; font-style: normal; }
    .event-button { width: 100%; padding: 9px 2px; display: grid; grid-template-columns: 45px 1fr auto; gap: 7px; align-items: center; border: 0; border-bottom: 1px dotted #263026; background: transparent; text-align: left; cursor: pointer; }
    .event-button:hover { background: rgba(120,140,114,.06); }
    .event-button > span { color: var(--amber); font-size: 7px; }
    .event-button div { display: flex; flex-direction: column; gap: 3px; }
    .event-button b { color: #9fa99b; font-size: 7px; font-weight: 400; }
    .event-button em { color: #515b50; font-size: 6px; font-style: normal; }
    .event-button strong { color: var(--green); font-size: 9px; font-weight: 400; }

    /* ----- 中间主内容 ----- */
    .panel-head { height: 72px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .kicker { color: var(--muted); font-size: 7px; letter-spacing: .12em; }
    .panel-head h2 { margin: 5px 0 0; color: var(--green-bright); font-size: 16px; font-weight: 400; letter-spacing: .15em; }
    .model-readout { color: #536052; font-size: 6px; text-align: right; line-height: 1.8; }
    .model-readout b { display: block; color: var(--green); font-weight: 400; }
    .surface { flex: 1; min-height: 610px; overflow: auto; }
    .ticker { min-height: 44px; display: grid; grid-template-columns: 55px 1fr; border-top: 1px solid var(--line-strong); background: #070a08; }
    .ticker > span { display: grid; place-items: center; border-right: 1px solid var(--line); color: var(--amber); font-size: 7px; }
    .ticker-list { padding: 5px 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; align-content: center; }
    .ticker p { margin: 0; overflow: hidden; color: #606b5e; font-size: 6px; white-space: nowrap; text-overflow: ellipsis; }
    .ticker time { color: #879581; margin-right: 7px; }
    .ticker b { color: var(--amber); margin-right: 6px; font-weight: 400; }

    /* ----- 曼哈顿 SVG 地图 ----- */
    .city-view { min-height: 610px; display: grid; grid-template-columns: minmax(430px,1fr) 200px; }
    .map-wrap { position: relative; min-height: 610px; overflow: hidden; border-right: 1px solid var(--line); background: #070a08; }
    .map { position: absolute; inset: 0; width: 100%; height: 100%; padding: 6px 3%; }
    .map-grid { fill: none; stroke: #273027; stroke-width: .45; }
    .water { fill: none; stroke: #202820; stroke-width: .8; stroke-dasharray: 4 6; }
    .zone { cursor: pointer; }
    .zone polygon { fill: var(--green); stroke: #60705d; stroke-width: .8; }
    .zone:hover polygon, .zone.active polygon { stroke: var(--green-bright); stroke-width: 1.5; }
    .zone-label { fill: #879582; font-size: 6px; text-anchor: middle; pointer-events: none; }
    .zone-risk { fill: #b4c0ad; font-size: 5px; text-anchor: middle; pointer-events: none; }
    .event-link { stroke: rgba(209,173,104,.45); stroke-width: .7; stroke-dasharray: 3 4; }
    .event-point circle, .event-point path { fill: none; stroke: var(--amber); stroke-width: .8; }
    .event-point circle:first-child { fill: var(--amber); }
    .event-point text { fill: var(--amber); font-size: 6px; }
    .person { cursor: pointer; }
    .person circle { fill: var(--red); }
    .person .frame { fill: rgba(217,80,73,.06); stroke: var(--red); stroke-width: 1.2; }
    .person .selected-frame { fill: none; stroke: var(--green-bright); stroke-width: .65; stroke-dasharray: 2 3; }
    .person.background circle { fill: #667363; }
    .person text { fill: #dbe2d4; font-size: 6.5px; }
    .person .person-score { fill: var(--red); font-size: 5.3px; }
    .person.background text { fill: #667363; }
    .scan { position: absolute; z-index: 2; left: 0; right: 0; height: 70px; pointer-events: none; background: linear-gradient(transparent, rgba(153,178,144,.05), transparent); animation: scan 7s linear infinite; }
    .legend { position: absolute; z-index: 3; right: 10px; bottom: 8px; left: 10px; padding: 7px; display: flex; justify-content: center; gap: 20px; border-top: 1px solid #222b22; background: rgba(5,8,6,.84); color: #5a6559; font-size: 6px; }
    .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border: 1px solid var(--red); vertical-align: middle; }
    .zone-panel { padding: 19px 13px; background: linear-gradient(180deg, rgba(17,23,17,.9), rgba(6,9,7,.85)); }
    .zone-panel h3 { margin: 7px 0 14px; color: var(--green-bright); font-size: 13px; font-weight: 400; }
    .big-risk { margin-bottom: 8px; color: var(--text); font-size: 32px; font-weight: 300; }
    .risk-track { height: 3px; overflow: hidden; background: #202720; }
    .risk-track span { display: block; height: 100%; background: var(--green); box-shadow: 0 0 6px rgba(145,168,138,.35); }
    .risk-track span.danger { background: var(--red); }
    .stats { margin: 18px 0 14px; }
    .stats div { padding: 8px 0; display: flex; justify-content: space-between; border-bottom: 1px dotted #293129; }
    .stats dt { color: #566155; font-size: 6px; }
    .stats dd { margin: 0; color: #a7b2a2; font-size: 7px; }
    .note { color: #596359; font-size: 6px; line-height: 1.6; }
    .ranking button { width: 100%; padding: 8px 0; display: grid; grid-template-columns: 22px 1fr auto; border: 0; border-bottom: 1px solid #202720; background: transparent; text-align: left; cursor: pointer; }
    .ranking button:hover { background: rgba(145,168,138,.05); }
    .ranking span { color: #4b554a; font-size: 6px; }
    .ranking b { color: #929d8e; font-size: 7px; font-weight: 400; }
    .ranking em { color: var(--green); font-size: 7px; font-style: normal; }

    /* ----- Evidence Graph ----- */
    .network { min-height: 610px; padding: 23px; background-image: linear-gradient(rgba(110,133,104,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(110,133,104,.035) 1px,transparent 1px); background-size: 22px 22px; }
    .view-title { display: flex; justify-content: space-between; align-items: start; }
    .view-title h2 { margin: 7px 0 0; color: var(--green-bright); font-size: 17px; font-weight: 400; }
    .view-title p { max-width: 280px; margin: 0; color: #667162; font-size: 7px; text-align: right; line-height: 1.5; }
    .network-flow { min-height: 450px; margin-top: 28px; display: grid; grid-template-columns: minmax(180px,1.2fr) 32px minmax(140px,.8fr) 32px minmax(180px,1fr); align-items: center; gap: 7px; }
    .column-label { margin-bottom: 8px; color: #596457; font-size: 6px; letter-spacing: .11em; }
    .records { display: grid; gap: 7px; }
    .node { position: relative; padding: 10px; border: 1px solid var(--line); background: rgba(12,17,13,.95); }
    .node > span { color: var(--amber); font-size: 6px; }
    .node h3 { margin: 7px 0 5px; color: #d0d7ca; font-size: 11px; font-weight: 400; }
    .node p { margin: 4px 0; color: #8f9a8c; font-size: 7px; line-height: 1.4; }
    .node small { color: #4c574c; font-size: 6px; }
    .record-node b { float: right; color: #74816f; font-size: 7px; font-weight: 400; }
    .entity-node { padding: 20px 11px; text-align: center; border-color: #61715e; }
    .avatar { width: 56px; height: 56px; margin: 12px auto; display: grid; place-items: center; border: 1px solid var(--red); color: var(--red); font-size: 16px; }
    .entity-node strong { color: var(--red); font-size: 9px; font-weight: 400; }
    .event-node { border-color: #796641; }
    .event-node strong { color: var(--amber); font-size: 9px; font-weight: 400; }
    .arrow { color: #526150; font-size: 19px; text-align: center; }
    .role-row { padding: 7px 0; display: flex; justify-content: space-between; border-bottom: 1px dotted #273027; color: #929d8f; font-size: 7px; }
    .role-row em { color: var(--green); font-style: normal; }

    /* ----- Model Core ----- */
    .model { min-height: 610px; padding: 23px; }
    .pipeline { margin: 25px 0 19px; display: grid; grid-template-columns: repeat(6,1fr); border: 1px solid var(--line); }
    .pipeline div { position: relative; min-height: 55px; padding: 9px; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--line); }
    .pipeline div:last-child { border: 0; }
    .pipeline span { color: #4f5a4d; font-size: 6px; }
    .pipeline b { margin-top: 7px; color: var(--green); font-size: 7px; font-weight: 400; }
    .formula-grid { display: grid; grid-template-columns: repeat(2,1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .formula { min-height: 132px; padding: 15px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .formula h3 { margin: 0; color: #9ca896; font-size: 8px; font-weight: 400; }
    .formula code { margin: 16px 0 12px; display: block; color: var(--green-bright); font-family: "Cambria Math", Georgia, serif; font-size: 14px; }
    .formula p { margin: 0; color: #596457; font-size: 7px; line-height: 1.5; }
    .metrics { margin-top: 19px; padding: 12px; display: grid; grid-template-columns: 1fr 1.4fr; align-items: center; border: 1px solid #655638; }
    .metrics p { color: #706850; font-size: 7px; line-height: 1.4; }
    .metrics dl { display: grid; grid-template-columns: repeat(5,1fr); margin: 0; }
    .metrics dl div { text-align: center; border-left: 1px solid #3b3525; }
    .metrics dt { color: #6b6655; font-size: 6px; }
    .metrics dd { margin: 6px 0 0; color: #c8b88e; font-size: 13px; }

    /* ----- 右侧人物档案 ----- */
    .dossier-head { min-height: 93px; padding: 14px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); background: linear-gradient(100deg, rgba(217,80,73,.07), transparent 60%); }
    .dossier-head span { color: var(--muted); font-size: 6px; }
    .dossier-head h2 { margin: 7px 0 4px; color: #d7ddcf; font-size: 16px; font-weight: 400; }
    .dossier-head p { margin: 0; color: #5b665a; font-size: 6px; }
    .stamp { align-self: start; padding: 4px 6px; border: 1px solid var(--red); color: var(--red); font-size: 6px; letter-spacing: .11em; }
    .score-block { padding: 15px 13px; display: grid; grid-template-columns: 92px 1fr; gap: 13px; border-bottom: 1px solid var(--line); }
    .score-ring { width: 84px; height: 84px; padding: 5px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--red) var(--score), #202720 0); }
    .score-ring div { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; background: var(--panel); }
    .score-ring strong { color: #e0e4da; font-size: 21px; font-weight: 300; }
    .score-ring span { color: #677161; font-size: 5px; }
    .score-block dl { margin: 0; }
    .score-block dl div { padding: 5px 0; display: flex; justify-content: space-between; border-bottom: 1px dotted #242c24; }
    .score-block dt { color: #566155; font-size: 6px; }
    .score-block dd { margin: 0; color: #a7b1a2; font-size: 6px; }
    .redacted { position: relative; margin: 10px 0 6px; padding: 7px; overflow: hidden; text-align: center; color: #606a5d; font-size: 8px; }
    .redacted::after { content: ""; position: absolute; inset: 5px 0; background: repeating-linear-gradient(90deg,#343c34 0 7px,#161c17 7px 9px); }
    .withheld { margin: 0; color: #84302d; font-size: 6px; text-align: center; }
    .bar-row { min-height: 23px; display: grid; grid-template-columns: 78px 1fr 29px; align-items: center; gap: 7px; }
    .bar-row label { color: #8e998a; font-size: 6px; }
    .bar-row b { color: #aeb8aa; font-size: 6px; font-weight: 400; text-align: right; }
    .evidence { padding: 8px 0; border-bottom: 1px dotted #283128; }
    .evidence div { display: flex; justify-content: space-between; color: var(--amber); font-size: 6px; }
    .evidence p { margin: 5px 0; color: #919b8e; font-size: 7px; line-height: 1.4; }
    .evidence small { color: #4c564b; font-size: 6px; }

    .footer { min-height: 25px; padding: 6px 14px; display: flex; justify-content: space-between; align-items: center; color: #465045; font-size: 6px; background: #050706; }
    .footer b { color: var(--amber); font-weight: 400; }

    @keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @keyframes scan { from { top:-80px; } to { top:100%; } }

    /* ----- 小屏幕：三栏自动改为纵向 ----- */
    @media (max-width: 1020px) {
      .workspace { grid-template-columns: 220px minmax(560px,1fr); }
      .dossier { grid-column: 1/-1; max-height: none; border-left: 0; border-top: 1px solid var(--line-strong); }
      .queue { max-height: none; }
    }
    @media (max-width: 800px) {
      .topbar { grid-template-columns: 1fr auto; padding: 0 13px; }
      .online { display: none; }
      .brand h1 { font-size: 15px; }
      .clock span, .clock em { display: none; }
      .modebar { display: block; padding: 0; }
      .mode-buttons, .surface-buttons { height: 38px; border-bottom: 1px solid var(--line); }
      .offline-badge { display: none; }
      .workspace { display: block; }
      .subject-list { display: grid; grid-template-columns: repeat(2,1fr); }
      .main-panel { border-top: 1px solid var(--line-strong); }
      .city-view { display: block; }
      .map-wrap { min-height: 630px; border-right: 0; }
      .zone-panel { display: none; }
      .network-flow { display: block; }
      .arrow { padding: 9px; transform: rotate(90deg); }
      .pipeline { grid-template-columns: repeat(3,1fr); }
      .formula-grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr; gap: 10px; }
      .footer { align-items: start; gap: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

<body>

    /* ================================================================
       PART 5 / 页面状态与渲染函数
       state 记录“用户当前选中了什么”；renderAll 根据 state 重画页面。
       ================================================================ */
    const state = {
      mode: "machine",
      surface: "city",
      threshold: MACHINE_DATA.meta.threshold,
      personId: MACHINE_DATA.people[0].id,
      zoneId: null
    };

    // 小工具：格式化百分数、时间和标题，并转义可能进入 HTML 的文字。
    const pct = (value, digits = 0) => `${(value * 100).toFixed(digits)}%`;
    const esc = (value) => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
    const titleCase = (value) => value.replaceAll("_", " ").replace(/\b\w/g, x => x.toUpperCase());
    const timeOnly = (iso) => new Date(iso).toLocaleTimeString("en-US", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "America/New_York"
    });
    const topEntry = (object) => Object.entries(object).sort((a, b) => b[1] - a[1])[0];
    const bar = (value, danger = false) => `<div class="risk-track"><span class="${danger ? "danger" : ""}" style="width:${Math.max(2, value * 100)}%"></span></div>`;

    function person() {
      return MACHINE_DATA.people.find(item => item.id === state.personId) || MACHINE_DATA.people[0];
    }
    function eventFor(selected = person()) {
      return MACHINE_DATA.events.find(item => item.id === selected.event_id) || MACHINE_DATA.events[0];
    }
    function zone() {
      return MACHINE_DATA.zones.find(item => item.id === state.zoneId) || MACHINE_DATA.zones[0];
    }
    function syncZoneToPerson() {
      const matched = MACHINE_DATA.zones.find(item => item.name === person().zone);
      if (matched) state.zoneId = matched.id;
    }
    syncZoneToPerson();

    // 左栏：人物队列、阈值滑杆和事件列表。
    function renderQueue() {
      const relevant = MACHINE_DATA.people.filter(item => item.involvement >= state.threshold);
      const peopleHtml = MACHINE_DATA.people.map((item, index) => {
        const visible = item.involvement >= state.threshold;
        if (!visible && state.mode === "machine") return "";
        const role = topEntry(item.roles)[0];
        return `
          <button class="subject-button ${item.id === state.personId ? "active" : ""} ${visible ? "" : "quiet"}" data-person="${esc(item.id)}">
            <span class="number">${String(index + 1).padStart(2, "0")}</span>
            <span class="identity"><b>${esc(item.code)}</b><em>${esc(item.event_id)} · T−${item.imminence_minutes}</em></span>
            <span class="score"><b>${pct(item.involvement)}</b><em>${state.mode === "analyst" ? role.toUpperCase() : "RELEVANT"}</em></span>
          </button>`;
      }).join("");

      const eventsHtml = MACHINE_DATA.events.map(item => `
        <button class="event-button" data-event="${esc(item.id)}">
          <span>${esc(item.id)}</span>
          <div><b>${esc(item.title)}</b><em>${esc(item.zone)} · ${item.signal_count} SIGNALS</em></div>
          <strong>${pct(item.risk)}</strong>
        </button>`).join("");

      document.getElementById("queue").innerHTML = `
        <div class="queue-head"><div><span>RELEVANT LIST</span><strong>${String(relevant.length).padStart(2, "0")}</strong></div><em>STATIC 21:40</em></div>
        <div class="threshold">
          <label for="threshold">FRAME THRESHOLD <b>${state.threshold.toFixed(2)}</b></label>
          <input id="threshold" type="range" min="0.35" max="0.90" step="0.01" value="${state.threshold}">
          <small><span>MORE SIGNALS</span><span>HIGH CERTAINTY</span></small>
        </div>
        <div class="subject-list">${peopleHtml}</div>
        <div class="section"><div class="section-title"><span>EVENT CANDIDATES</span><em>${MACHINE_DATA.events.length}</em></div>${eventsHtml}</div>`;
    }

    // 中间顶部标题。
    function renderPanelHead() {
      const names = {
        city: ["BOROUGH / MANHATTAN", "CITY GRID"],
        network: ["SUBGRAPH / ACTIVE SUBJECT", "EVIDENCE GRAPH"],
        model: ["ENGINE / TRANSPARENT BASELINE", "MODEL CORE"]
      };
      document.getElementById("panel-head").innerHTML = `
        <div><span class="kicker">${names[state.surface][0]}</span><h2>${names[state.surface][1]}</h2></div>
        <div class="model-readout">MODEL<b>${esc(MACHINE_DATA.meta.model_version)}</b>STATIC OFFLINE FRAME</div>`;
    }

    // City Grid：数据中的 polygon 和 coordinates 直接变成 SVG。
    function renderMap() {
      const selected = person();
      const activeZone = zone();
      const zonesSvg = MACHINE_DATA.zones.map(item => `
        <g class="zone ${item.id === state.zoneId ? "active" : ""}" data-zone="${esc(item.id)}" role="button" tabindex="0">
          <polygon points="${item.polygon.map(point => point.join(",")).join(" ")}" style="fill-opacity:${0.12 + item.risk * 0.42}"></polygon>
          <text x="${item.centroid[0]}" y="${item.centroid[1]}" class="zone-label">${esc(item.name.toUpperCase())}</text>
          ${state.mode === "analyst" ? `<text x="${item.centroid[0]}" y="${item.centroid[1] + 13}" class="zone-risk">RISK ${pct(item.risk)}</text>` : ""}
        </g>`).join("");

      const linksSvg = MACHINE_DATA.people.filter(item => item.involvement >= state.threshold).map(item => {
        const linked = MACHINE_DATA.events.find(candidate => candidate.id === item.event_id);
        return linked ? `<line class="event-link" x1="${item.coordinates[0]}" y1="${item.coordinates[1]}" x2="${linked.coordinates[0]}" y2="${linked.coordinates[1]}"></line>` : "";
      }).join("");

      const eventsSvg = MACHINE_DATA.events.map(item => `
        <g class="event-point" transform="translate(${item.coordinates[0]} ${item.coordinates[1]})">
          <circle r="5"></circle><circle r="11"></circle><path d="M-14 0H14M0-14V14"></path><text x="15" y="-9">${esc(item.id)}</text>
        </g>`).join("");

      const peopleSvg = MACHINE_DATA.people.map(item => {
        const relevant = item.involvement >= state.threshold;
        if (!relevant && state.mode === "machine") return "";
        return `
          <g class="person ${relevant ? "" : "background"}" data-person="${esc(item.id)}" transform="translate(${item.coordinates[0]} ${item.coordinates[1]})" role="button" tabindex="0">
            <circle r="3.5"></circle>
            ${relevant ? `<rect class="frame" x="-13" y="-18" width="26" height="36"></rect>` : ""}
            ${item.id === selected.id ? `<rect class="selected-frame" x="-18" y="-23" width="36" height="46"></rect>` : ""}
            <text x="17" y="-7">${esc(item.code)}</text>
            <text x="17" y="6" class="person-score">${state.mode === "analyst" ? `INV ${pct(item.involvement)}` : "RELEVANT"}</text>
          </g>`;
      }).join("");

      const ranking = MACHINE_DATA.zones.slice().sort((a,b) => b.risk - a.risk).slice(0,5).map((item,index) => `
        <button data-zone="${esc(item.id)}"><span>0${index + 1}</span><b>${esc(item.name)}</b><em>${pct(item.risk)}</em></button>`).join("");

      return `
        <div class="city-view">
          <div class="map-wrap"><div class="scan"></div>
            <svg class="map" viewBox="0 0 420 760" role="img" aria-label="虚构曼哈顿风险地图">
              <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0L0 0 0 20" class="map-grid"></path></pattern></defs>
              <rect width="420" height="760" fill="url(#grid)"></rect>
              <path class="water" d="M92 20C122 142 106 273 84 389C64 502 97 647 132 741"></path>
              <path class="water" d="M314 14C327 153 339 285 328 404C319 518 298 643 249 745"></path>
              ${zonesSvg}${linksSvg}${eventsSvg}${peopleSvg}
            </svg>
            <div class="legend"><span><i></i>RELEVANT SUBJECT</span><span>＋ CANDIDATE EVENT</span><span>▰ SCENARIO RISK</span></div>
          </div>
          <aside class="zone-panel">
            <div class="kicker">AREA AGGREGATE</div><h3>${esc(activeZone.name)}</h3>
            <div class="big-risk">${pct(activeZone.risk)}</div>${bar(activeZone.risk, activeZone.risk > .55)}
            <dl class="stats"><div><dt>STATE</dt><dd>${esc(activeZone.trend.toUpperCase())}</dd></div><div><dt>EVENT LINKS</dt><dd>${activeZone.contributors.length}</dd></div><div><dt>MODEL</dt><dd>KDE / 92U</dd></div></dl>
            <p class="note">Synthetic scenario-risk index—not a real Manhattan crime rate.</p>
            <div class="ranking">${ranking}</div>
          </aside>
        </div>`;
    }

    // Evidence Graph：把人物的证据、人物节点和事件节点排成计算流程。
    function renderNetwork() {
      const selected = person();
      const linked = eventFor(selected);
      const records = selected.evidence.map(item => `
        <article class="node record-node"><span>${esc(item.source.toUpperCase())}</span><b>${esc(item.id)}</b><p>${esc(item.summary)}</p><small>q=${item.reliability.toFixed(2)}</small></article>`).join("");
      const roles = Object.entries(selected.roles).map(([role,value]) => `<div class="role-row"><span>${esc(titleCase(role))}</span><em>${pct(value)}</em></div>`).join("");
      const initials = selected.name.split(" ").map(part => part[0]).join("");
      return `
        <div class="network">
          <div class="view-title"><div><span class="kicker">TEMPORAL HETEROGENEOUS GRAPH</span><h2>${esc(selected.code)} / ${esc(linked.id)}</h2></div><p>${selected.evidence.length} records · one person · one candidate event<br>Edges show computation, not causation.</p></div>
          <div class="network-flow">
            <section><div class="column-label">RAW RECORDS</div><div class="records">${records}</div></section>
            <div class="arrow">→</div>
            <section><div class="column-label">ENTITY</div><article class="node entity-node"><span>${esc(selected.id)}</span><div class="avatar">${esc(initials)}</div><h3>${esc(selected.code)}</h3><p>${esc(selected.occupation)}</p><strong>${pct(selected.involvement)} INVOLVED</strong></article></section>
            <div class="arrow">→</div>
            <section><div class="column-label">INFERENCE</div><article class="node event-node"><span>${esc(linked.id)}</span><h3>${esc(linked.title)}</h3><p>${esc(linked.location)}</p><strong>T−${linked.imminence_minutes} MIN</strong></article><article class="node" style="margin-top:9px"><span>ROLE POSTERIOR</span>${roles}</article></section>
          </div>
        </div>`;
    }

    // Model Core：这些公式与 Python baseline 一一对应。
    function renderModel() {
      const formulae = [
        ["01 / Temporal reliability", "wₒ(t) = qₒ · exp(−ln2 · Δt / hₛ)", "Fresh and reliable observations receive more weight."],
        ["02 / Evidence fusion", "zₖ = 1 − ∏ₒ(1 − wₒfₒₖ)", "Noisy-OR combines clues while keeping every feature bounded."],
        ["03 / Graph propagation", "gᵢₑ = 1 − ∏ⱼ(1 − 0.58aᵢⱼmⱼₑ)", "One bounded hop transfers support through explicit links."],
        ["04 / Involvement", "P(Iᵢₑ=1)=σ(−2.55+βᵀz+0.8g+1.1τ)", "The red frame means event involvement, not guilt."],
        ["05 / Role posterior", "P(role=c|I=1)=exp(s꜀)/Σᵣexp(sᵣ)", "Victim, perpetrator and ambiguous compete in a softmax."],
        ["06 / Spatial risk", "R(a,t)=1−exp[−η(bₐ+ΣₑpₑτₑKₕ(dₐₑ))]", "A Gaussian kernel spreads fictional event risk to nearby zones."]
      ];
      const cards = formulae.map(item => `<article class="formula"><h3>${item[0]}</h3><code>${item[1]}</code><p>${item[2]}</p></article>`).join("");
      const m = MACHINE_DATA.metrics;
      return `
        <div class="model">
          <div class="view-title"><div><span class="kicker">AUDITABLE BASELINE / v0.1</span><h2>From records to a red frame</h2></div><p>Every score is embedded in this HTML and reproducible from the Python engine.</p></div>
          <div class="pipeline">${["RECORDS","FEATURES","GRAPH","INVOLVEMENT","ROLE + TYPE","MAP + UI"].map((item,index) => `<div><span>0${index+1}</span><b>${item}</b></div>`).join("")}</div>
          <div class="formula-grid">${cards}</div>
          <section class="metrics"><div><span class="kicker" style="color:var(--amber)">SYNTHETIC SANITY CHECK</span><p>Verifies pipeline wiring only; this is not a real-world benchmark.</p></div><dl><div><dt>PRECISION</dt><dd>${pct(m.precision)}</dd></div><div><dt>RECALL</dt><dd>${pct(m.recall)}</dd></div><div><dt>F1</dt><dd>${pct(m.f1)}</dd></div><div><dt>BRIER ↓</dt><dd>${m.brier.toFixed(3)}</dd></div><div><dt>PAIRS</dt><dd>${m.evaluated_pairs}</dd></div></dl></section>
        </div>`;
    }

    // 右栏：所选人物的分数、角色、犯罪类型、贡献与证据。
    function renderDossier() {
      const selected = person();
      const dominantCrime = topEntry(selected.crime_types)[0];
      const relevant = selected.involvement >= state.threshold;
      const roleContent = state.mode === "machine"
        ? `<div class="section"><div class="kicker">ROLE CLASSIFICATION</div><div class="redacted">VICTIM / PERPETRATOR</div><p class="withheld">WITHHELD IN MACHINE VIEW</p></div>`
        : `<div class="section"><div class="section-title"><span>ROLE POSTERIOR</span><em>H=${selected.role_uncertainty.toFixed(2)}</em></div>${Object.entries(selected.roles).map(([name,value]) => `<div class="bar-row"><label>${esc(titleCase(name))}</label>${bar(value,name === "perpetrator")}<b>${pct(value)}</b></div>`).join("")}</div>`;
      const crimes = Object.entries(selected.crime_types).sort((a,b) => b[1]-a[1]).map(([name,value]) => `<div class="bar-row"><label>${esc(titleCase(name))}</label>${bar(value)}<b>${pct(value)}</b></div>`).join("");
      const explanations = selected.explanations.map(item => `<div class="bar-row" title="${esc(item.record_ids.join(", "))}"><label>${esc(item.label)}</label>${bar(item.value * 3.7)}<b>+${(item.value * 100).toFixed(1)}</b></div>`).join("");
      const evidence = selected.evidence.slice(0,3).map(item => `<article class="evidence"><div><span>${esc(item.id)}</span><time>${timeOnly(item.timestamp)}</time></div><p>${esc(item.summary)}</p><small>${esc(item.source.toUpperCase())} · q=${item.reliability.toFixed(2)}</small></article>`).join("");
      document.getElementById("dossier").innerHTML = `
        <header class="dossier-head"><div><span>SUBJECT FILE / ${esc(selected.id)}</span><h2>${esc(selected.code)}</h2><p>${esc(selected.occupation)} · ${esc(selected.zone)}</p></div><div class="stamp">${relevant ? "RELEVANT" : "BELOW"}</div></header>
        <section class="score-block"><div class="score-ring" style="--score:${selected.involvement * 360}deg"><div><strong>${pct(selected.involvement)}</strong><span>INVOLVEMENT</span></div></div><dl><div><dt>EVENT</dt><dd>${esc(selected.event_id)}</dd></div><div><dt>WINDOW</dt><dd>T−${selected.imminence_minutes} MIN</dd></div><div><dt>CONFIDENCE</dt><dd>${pct(selected.confidence)}</dd></div><div><dt>TYPE</dt><dd>${esc(dominantCrime.toUpperCase())}</dd></div></dl></section>
        ${roleContent}
        <section class="section"><div class="section-title"><span>CRIME TYPE MIX</span><em>SOFTMAX</em></div>${crimes}</section>
        <section class="section"><div class="section-title"><span>SCORE CONTRIBUTION</span><em>TOP 5</em></div>${explanations}</section>
        <section class="section"><div class="section-title"><span>LATEST EVIDENCE</span><em>${selected.evidence.length} ITEMS</em></div>${evidence}</section>`;
    }

    function renderTicker() {
      document.getElementById("ticker").innerHTML = `<span>INGEST</span><div class="ticker-list">${MACHINE_DATA.timeline.slice(0,4).map(item => `<p><time>${timeOnly(item.timestamp)}</time><b>${esc(item.id)}</b>${esc(item.summary)}</p>`).join("")}</div>`;
    }

    // 总开关：任何状态变化后，调用一次就能让页面保持一致。
    function renderAll() {
      document.querySelectorAll("[data-mode]").forEach(button => button.classList.toggle("active", button.dataset.mode === state.mode));
      document.querySelectorAll("[data-surface]").forEach(button => button.classList.toggle("active", button.dataset.surface === state.surface));
      renderQueue();
      renderPanelHead();
      document.getElementById("surface").innerHTML = state.surface === "city" ? renderMap() : state.surface === "network" ? renderNetwork() : renderModel();
      renderTicker();
      renderDossier();
    }

    /* ================================================================
       PART 6 / 用户交互事件
       只监听一次整个 document，再根据 data-* 属性判断用户点了什么。
       这叫 event delegation（事件委托），比给每个按钮单独绑定更简单。
       ================================================================ */
    document.addEventListener("click", (event) => {
      const modeButton = event.target.closest("[data-mode]");
      const surfaceButton = event.target.closest("[data-surface]");
      const personButton = event.target.closest("[data-person]");
      const zoneButton = event.target.closest("[data-zone]");
      const eventButton = event.target.closest("[data-event]");

      if (modeButton) state.mode = modeButton.dataset.mode;
      else if (surfaceButton) state.surface = surfaceButton.dataset.surface;
      else if (personButton) { state.personId = personButton.dataset.person; syncZoneToPerson(); }
      else if (zoneButton) state.zoneId = zoneButton.dataset.zone;
      else if (eventButton) {
        const first = MACHINE_DATA.people.find(item => item.event_id === eventButton.dataset.event && item.involvement >= state.threshold);
        if (first) { state.personId = first.id; syncZoneToPerson(); }
      } else return;

      renderAll();
    });

    document.addEventListener("input", (event) => {
      if (event.target.id !== "threshold") return;
      state.threshold = Number(event.target.value);
      renderAll();
    });

    document.addEventListener("keydown", (event) => {
      if ((event.key === "Enter" || event.key === " ") && event.target.matches('[role="button"]')) {
        event.preventDefault();
        event.target.click();
      }
    });

    // 第一次打开文件时，画出完整页面。
    renderAll();
  </script>
</body>
</html>
